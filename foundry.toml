[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = '0.8.19'
optimizer = true
optimizer_runs = 1000000
via_ir = true
no_match_path = "*/fork/*"
evm_version = "shanghai"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[profile.fork]
match_path = "*/fork/*"
no_match_path = "override/default/*"
